session_name: GPS Waypoint Follower Launch
windows:
  - window_name: GPS Waypoint Follower Launch
    layout: tiled
    panes:
      - shell_command:
        - source tools/scripts/source_all.sh
        - ros2 launch vesc_interface vesc_interface.launch.py
      - shell_command:
        - source tools/scripts/source_all.sh
        - ros2 launch robocar_launch robocar.launch.py
      - shell_command:
        - source tools/scripts/source_all.sh
        - ros2 launch gps_waypoint_follower gps_waypoint_follower.launch.py
      - shell_command:
        - source tools/scripts/source_all.sh
        - ros2 launch basestation_launch basestation.launch.py
      - shell_command:
        - source tools/scripts/source_all.sh
        - ros2 launch autonomy_launch misc.launch.py
      - shell_command:
        - source tools/scripts/source_all.sh
