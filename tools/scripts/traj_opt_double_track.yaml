  max_jerk_mpsc: 10.0 # max jerk (m/s^3)

model:
  kd_f: 0.0 # front drive force bias (rear is 1 - kd_f)
  kb_f: 0.0 # front brake force bias (rear is 1 - kb_f)
  mass: 3.518 # mass of car (kg)
  Jzz: 0.04712 # MOI around z axis (kg * m^2)
  lf: 0.15875 # cg to front axle (m)
  lr: 0.17145 # cg to rear axle (m)
  twf: 0.281 # front track width (m)
  twr: 0.281 # rear track width (m)
  delta_max: 0.314159 # max front wheel angle (rad)
  vehicle_width: 0.30 # physical vehicle width (m)
  safety_margin: 1.0 # safety margin added to vehicle width (m)

  fr: 0.01 # rolling resistance coefficient
  hcog: 0.074 # center of gravity height
  kroll_f: 0.5 # front roll moment distribution

  cl_f: 0.0 # downforce coefficient at front
  cl_r: 0.0 # downforce coefficient at rear
  rho: 1.2041 # air density (kg / m^3)
  A: 0.4 # frontal area (m^2)
  cd: 0.0136 # drag coefficient
  mu: 1.0 # tyre - track friction coefficient

  Bf: 7.4 # magic formula B - front
  Cf: 1.2 # magic formula C - front
  Ef: 0.85 # magic formula E - front
  Fz0_f: 8.6 # magic formula Fz0 - front
  eps_f: -0.0813 # extended magic formula epsilon - front
  Br: 7.4 # magic formula B - rear
  Cr: 1.2 # magic formula C - rear
  Er: 0.85 # magic formula E - rear
  Fz0_r: 8.6 # magic formula Fz0 - rear
  eps_r: -0.1263 # extended magic formula epsilon - rear

  Pmax: 267.0 # motor max power
  Fd_max: 33.4 # max driver force
  Fb_max: -47.4 # max brake force
  Td: 0.1 # drive time constant
  Tb: 0.1 # brake time constant
  Tdelta: 0.1 # steering time constant